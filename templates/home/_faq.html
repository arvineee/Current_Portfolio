  <!-- ── FAQ ───────────────────────────────────────────────────────────────── -->
  <section id="faq" style="padding:5rem 1.5rem;background:#F7F4EE;">
    <div style="max-width:820px;margin:0 auto;">
      <div style="text-align:center;margin-bottom:2.5rem;">
        <span class="eyebrow" style="display:block;margin-bottom:.75rem;">FAQ</span>
        <h2 class="section-title">Web development in Kenya:<br/>your questions answered.</h2>
      </div>
      <div style="display:flex;flex-direction:column;gap:.75rem;">
        {% for f in faqs %}
        <details class="reveal" style="background:#FAF8F4;border:1px solid #E5E0D5;border-radius:8px;padding:1rem 1.25rem;">
          <summary style="cursor:pointer;font-weight:600;font-size:.95rem;color:#1A1A1A;">{{ f.q }}</summary>
          <p style="margin-top:.75rem;font-size:.875rem;color:#585858;line-height:1.7;">{{ f.a }}</p>
        </details>
        {% endfor %}
      </div>
    </div>
  </section>
