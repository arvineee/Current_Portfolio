  <!-- ── SERVICES ──────────────────────────────────────────────────────────── -->
  <section id="services" style="padding:5rem 1.5rem;background:#EFECE5;">
    <div style="max-width:1100px;margin:0 auto;">
      <div style="margin-bottom:3rem;">
        <span class="eyebrow" style="display:block;margin-bottom:.75rem;">What I Build</span>
        <h2 class="section-title">Web development services<br />built to grow your business.</h2>
        <p class="section-sub" style="margin-top:1rem;">Every project is built to be fast, secure, and easy for your customers to actually use.</p>
      </div>


      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:1.25rem;">
        {% for s in services %}
        <div class="feature-card reveal">
          <div class="feature-icon">{{ s.icon }}</div>
          <h3 style="font-family:'Inter',sans-serif;font-weight:700;font-size:1.05rem;color:#1A1A1A;margin-bottom:.65rem;">{{ s.title }}</h3>
          <p style="font-size:.875rem;color:#585858;line-height:1.65;margin-bottom:1.25rem;">{{ s.desc }}</p>
          <div style="display:flex;flex-wrap:wrap;gap:.4rem;">
            {% for tag in s.tags %}
            <span class="tag">{{ tag }}</span>
            {% endfor %}
          </div>
        </div>
        {% endfor %}
      </div>
    </div>
  </section>
